l_english:
  # Russian Ideologies
    mat_rossiya_ideology_naradoism: "Narodist"
    mat_rossiya_ideology_naradoism_desc: "#lore Narodism, also known as Narodnichestvo, is a form of Agrarian socialism that emerged due to the conditions of Russian serfdom. They believe in the peasantry as a revolutionary class and view the peasant communes, the Mirs, as prototypes of the new society that they seek to create. #!"

  # Alaskan Ideologies
    mat_rossiya_ideology_native_alaskan_fishing: "Native Fishing"
    mat_rossiya_ideology_native_alaskan_fishing_desc: "#lore This group supports the traditional modes of agriculture and fishing. #!"

    mat_rossiya_ideology_tribal_anti_colonialism: "Anti-Colonialism"
    mat_rossiya_ideology_tribal_anti_colonialism_desc: "#lore This group opposes colonial governance that oppresses their traditional way of life. #!"

  # Circassian Ideologies
    mat_rossiya_ideology_khazbism: "Khazbism"
    mat_rossiya_ideology_khazbism_desc: "#lore Khabzism is the worldview and moral code of the Circassian people that has long guided the tribes of Circassia, and this group seeks to keep its ancient traditions and customs. Key to it is the tribal councils known as Khase. #!"

  # Imamate Ideologies
    mat_rossiya_ideology_mauridism: "Mauridism"
    mat_rossiya_ideology_mauridism_desc: "#lore The Imamate is led by a sufi imam of the Naqshbandi order and governance is to be subordinate to the imam as their religious teacher and political leader. #!"

    mat_rossiya_ideology_mauridism_leader: "Mauridist"
    mat_rossiya_ideology_mauridism_leader_desc: "#lore The Imamate is led by a sufi imam of the Naqshbandi order and governance is to be subordinate to the imam as their religious teacher and political leader. #!"

    mat_rossiya_ideology_caucasian_sharia: "Sharia"
    mat_rossiya_ideology_caucasian_sharia_desc: "#lore This group believes in implementing Sharia law as interpreted by Ismail Shamil and his teachers at the expense of the local khans. #!"

    mat_rossiya_ideology_caucasian_ghazi: "Ghazism"
    mat_rossiya_ideology_caucasian_ghazi_desc: "#lore The Fight against the Orthodox Russians that seek to oppress calls for holy wars to put aside tribal boundaries and fight for God. #!"

    mat_rossiya_ideology_islamic_modernism: "Islamic Modernism"
    mat_rossiya_ideology_islamic_modernism_desc: "#lore This group believes in modernizing according to islamic principles. Looking to the West and the Ottoman Empire while keeping an islamic character. #!"

    mat_rossiya_ideology_imamate_shura: "Shura"
    mat_rossiya_ideology_imamate_shura_desc: "#lore This group believes that good jurisprudence is based on the Islamic principle of #italic shura#!, consultation and collective decision-making, and that the foundation of any solid government relies on the support and deliberation of learned scholars and landowning notables.#!"

  # Polish Ideologies
    mat_rossiya_ideology_commonwealth_nostologia: "Commonwealth Nostologia"
    mat_rossiya_ideology_commonwealth_nostologia_desc: "#lore This group looks back to the days of the Commonwealth of Poland Lithuania, where the szlachta ruled their crowned republic and all the rights and freedoms that they had back then and seek to restore their ancient rights. #!"

    mat_rossiya_ideology_catholic_moralism: "Catholic Moralism (Russian)"
    mat_rossiya_ideology_catholic_moralism_desc: "#lore Facing russification in Poland, the Catholic church in Poland seeks to ensure that its rights and privileges are protected and that the imposition of Russian Orthodoxy is curtailed as much as possible.  #!"
  
  # Kazakh Ideologies
    mat_rossiya_ideology_steppe_pastoralism: "Steppe Pastoralism"
    mat_rossiya_ideology_steppe_pastoralism_desc: "#lore This group strongly believes in the semi-nomadic pastoral nomadicism that has long dominated the steppe, and seeks to preserve their rights and freedoms. #!"


    mat_rossiya_ideology_steppe_freedom: "Steppe Freedom"
    mat_rossiya_ideology_steppe_freedom_desc: "#lore This group believes that it has a right to travel where they see fit along the great eurasian steppe and resent control by governments in limiting where they can travel. #!"













