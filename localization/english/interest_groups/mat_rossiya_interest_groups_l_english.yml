  # Imamate IGs
    mat_rossiya_ig_khans: "Khans"
    mat_rossiya_ig_khans_desc: "The various Khans and sultans and other tribal chiefs of the various polities of the Caucasus are the land owning elite who value their localism and their own tribe first and their ancient rights and powers. "

    mat_rossiya_ig_naibs: "Naibs"
    mat_rossiya_ig_naibss_desc: "The Naibs are the military-administrative officials who are appointed to govern various regions of the Imamate both as an administrative leader and as a military officer. "

  # Poland
    mat_rossiya_ig_catholic_church: "Catholic Church"
    mat_rossiya_ig_catholic_church_desc: "The Catholic Church in Poland seeks to protect its way of life and to oppose the imposition of Orthodoxy onto the Polish people. While a conservative organization while Poland is firmly under the Russian Empire, it supports more tolerant policies so it can continue to minister to the Catholic population of Poland."

