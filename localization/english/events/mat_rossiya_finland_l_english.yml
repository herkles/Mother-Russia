l_english:
  mat_rossiya_finaland.001.t: "A banner for the Grand Duchy?"
  mat_rossiya_finaland.001.d: "The grand duchy of Finland does not have its own official banner to fly in international matters. A variety of maritime banners are used as symbolic flags and banners of the Grand duchy. So the parliament of the Grand duchy has requisite from the emperor a chance to discuss some of the proposals so that a banner fitting his worth can be presented to him."
  mat_rossiya_finaland.001.f: """It is for you, the representatives of the Grand Duchy, to prove, by the dignity, the moderation, and the calmness of your discussions, that in the hands of a wise and well-conducted people, determined to work hand in hand with the Sovereign in a practical manner for the development of its well-being, liberal institutions, far from being a danger, become a guarantee of order and prosperity."\n\n—Alexander II"
  mat_rossiya_finaland.001.a: "The flag of Russia will be the official banner"
  mat_rossiya_finaland.001.b: "They can debate this"

  mat_rossiya_finaland.002.t: "A banner for the Grand Duchy"
  mat_rossiya_finaland.002.d: "The grand duchy of Finland does not have its own official banner to fly in international matters. A variety of maritime banners are used as symbolic flags and banners of the Grand duchy. However, with no standard banner, the many different maritime flags from private yacht companies to merchant marines, to individual regimental boats of the navy, do cause more than a fair bit of confusion. So the parliament has proposed three banners to represent our Grand Duchy to the world."
  mat_rossiya_finaland.002.f: """It is for you, the representatives of the Grand Duchy, to prove, by the dignity, the moderation, and the calmness of your discussions, that in the hands of a wise and well-conducted people, determined to work hand in hand with the Sovereign in a practical manner for the development of its well-being, liberal institutions, far from being a danger, become a guarantee of order and prosperity."\n\n—Alexander II"
  mat_rossiya_finaland.002.a: "The 1820s maritime flag."
  mat_rossiya_finaland.002.b: "The coat of arms on a white banner."
  mat_rossiya_finaland.002.c: "A blue cross on a white field."
