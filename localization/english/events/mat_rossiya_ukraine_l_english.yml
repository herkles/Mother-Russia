l_english:
  mat_rossiya_ukraine.001.t: "The People's flag"
  mat_rossiya_ukraine.001.d: "With the declaration of soviet power, an all soviet council has been convened in Kyiv to decide on the flag of our new soviet power. Several designs have been brought up by various delegates. One that has a blue stripe below the red flag and a hammer and sickle. Another that has the blue and yellow banner of Ukraine in the canton of a red flag, and another that has in Cyrillic the letters YCCP."
  mat_rossiya_ukraine.001.f: """Complete equality of all nations living in Ukraine, rejecting any national privileges, eliminating the possibility of national enmity and setting as a task for the Soviet government to assist the workers of underdeveloped nations by raising national culture, to their best development.""\n\n—Consitution of the Ukrainian Socialist Soviet Republic , 1919"
  mat_rossiya_ukraine.001.a: "The People's flag shall be a red flag with a hammer and sickle and a blue stripe on the bottom."
  mat_rossiya_ukraine.001.b: "The People's flag shall be a red flag with the canton being blue and yellow. "
  mat_rossiya_ukraine.001.c: "The People's flag shall be a red flag with the letters YCCP in the canton. "
