l_english:

  mat_rossiya_russia.001.t: "Fire at the Winter Palace"
  mat_rossiya_russia.001.d: "While the Emperor and his wife were watching a ballet when an official burst into the box shouting about the fire in the Winter Palace. The emperor and the court worked to fight the fire and protect his family and valuables. Eyewitnesses report that the fiery glow was so intense that it was visible to peasants and travelers 50 to 70 miles from the capital."
  mat_rossiya_russia.001.f: ""The Winter Palace at St. Petersburg, the residence of the Emperor, his court, and retinue, amounting in the whole to some 5000 persons, is an immense edifice, with four facades, each about 400 feet in length, situated on the banks of the Neva, and in the neighborhood of the Exchange. The exterior is embellished by upwards of five hundred columns of Grecian architecture. The faces are judiciously broken, so as to prevent the appearance of monotony, which would otherwise occur. This palace, destroyed by fire in 1837, was immediately rebuilt in a style of still greater magnificence, the floors and ceilings being made fireproof.""
  mat_rossiya_russia.001.a: "The Polish will be brought in line"



