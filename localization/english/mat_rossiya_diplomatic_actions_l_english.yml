l_english:
  # Loyalty and Disloyalty
    mat_rossiya_disloyal_subject: "Denounce the Suzerainty of the Russian Empire"
    mat_rossiya_disloyal_subject_desc: "The Russian Empire has only placed fetters upon us. As they bleed in the mountains of the Caucasus, now might be the time to plot our own path towards freedom."
    mat_rossiya_disloyal_subject_pact_desc: "$mat_rossiya_disloyal_subject_desc$"
    mat_rossiya_disloyal_subject_action_name: "$mat_rossiya_disloyal_subject$"
    mat_rossiya_disloyal_subject_action_notification_name: "[INITIATOR_COUNTRY.GetName] Denounce the Russian Empire"
    mat_rossiya_disloyal_subject_action_notification_desc: "[INITIATOR_COUNTRY.GetName] has emphatically rejected the suzerainty of the [TARGET_COUNTRY.GetName]."
    mat_rossiya_disloyal_subject_action_propose_name: "[INITIATOR_COUNTRY.GetName] Denounces Our Suzerainty"
    mat_rossiya_disloyal_subject_action_break_name: "Withdraw Denunciation of the Russian Empire"
    mat_rossiya_disloyal_subject_action_notification_break_name: "[INITIATOR_COUNTRY.GetName] Withdraws Denunciation of the Russian Empire"
    mat_rossiya_disloyal_subject_action_notification_break_desc: "[INITIATOR_COUNTRY.GetName] has withdrawn its denunciation of the Russian Empire [TARGET_COUNTRY.GetName]."
    mat_rossiya_disloyal_subject_action_notification_third_party_name: "$mat_rossiya_disloyal_subject_action_notification_name$"
    mat_rossiya_disloyal_subject_action_notification_third_party_desc: "$mat_rossiya_disloyal_subject_action_notification_desc$"
    mat_rossiya_disloyal_subject_action_notification_third_party_break_name: "$mat_rossiya_disloyal_subject_action_notification_break_name$"
    mat_rossiya_disloyal_subject_action_notification_third_party_break_desc: "$mat_rossiya_disloyal_subject_action_notification_break_desc$"

    mat_rossiya_loyal_subject: "Declare Fealty to the Russian Empire"
    mat_rossiya_loyal_subject_desc: "The Russian Empire has arrived to protect us from the raids of other tribes that have warred with us. It is only reasonable to support the empire and seek protection from our enemies."
    mat_rossiya_loyal_subject_pact_desc: "$mat_rossiya_loyal_subject_desc$"
    mat_rossiya_loyal_subject_action_name: "$mat_rossiya_loyal_subject$"
    mat_rossiya_loyal_subject_action_notification_name: "[INITIATOR_COUNTRY.GetName] Declares Fealty to the Russian Empire"
    mat_rossiya_loyal_subject_action_notification_desc: "[INITIATOR_COUNTRY.GetName] has declared its unyielding loyalty to the Russian Empire and the Emperor's court."
    mat_rossiya_loyal_subject_action_propose_name: "[INITIATOR_COUNTRY.GetName]"
    mat_rossiya_loyal_subject_action_break_name: "Withdraw Fealty to the Russian Empire"
    mat_rossiya_loyal_subject_action_notification_break_name: "[INITIATOR_COUNTRY.GetName] Withdraws Fealty to the Russian Empire"
    mat_rossiya_loyal_subject_action_notification_break_desc: "[INITIATOR_COUNTRY.GetName] has withdrawn its declaration of loyalty to the Russian Empire and the Emperor's court."
    mat_rossiya_loyal_subject_action_notification_third_party_name: "$mat_rossiya_loyal_subject_action_notification_name$"
    mat_rossiya_loyal_subject_action_notification_third_party_desc: "$mat_rossiya_loyal_subject_action_notification_desc$"
    mat_rossiya_loyal_subject_action_notification_third_party_break_name: "$mat_rossiya_loyal_subject_action_notification_break_name$"
    mat_rossiya_loyal_subject_action_notification_third_party_break_desc: "$mat_rossiya_loyal_subject_action_notification_break_desc$"
    mat_rossiya_diplomatic_pact_requirement_subject_relation: "[SCOPE.sCountry('source_country').GetName] must be a [concept_subject] of [SCOPE.sCountry('target_country').GetName]"
