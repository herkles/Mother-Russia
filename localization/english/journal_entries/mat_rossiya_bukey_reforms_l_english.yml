   # Buttons
      mat_rossiya_visit_russia_button: "Schedule Trip to Russia"
      mat_rossiya_visit_russia_button_desc: "The Russian Empire has turned its gaze to the Steppe and its cities. This ascendency has raised some eyebrows in the [ROOT.GetCountry.GetAdjectiveNoFormatting] court. The Khan has been granted an offer to visit Russia and pay homage to the Emperor, and while there to visit the great universities of the Empire."

