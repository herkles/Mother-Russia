      je_mat_rossiya_bukey_modernization: "Jangir's Reforms"
      je_mat_rossiya_bukey_modernization_reason: "The Khan has set out a grand and ambitious plan to modernize the Bukey horde in the model of the Russian Empire. To that pastoral nomadicism has to go with sedentary people taking its place. The khan should be an absolute autocrat like the emperor of Russia is. Further Jangir has declared that education particularly in disease and poetry are to be studied and learned from."
   
